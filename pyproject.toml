[project]
name = "specialist-description"
version = "0.1.0"
description = "URDF, MJCF and xacro descriptions of the Specialist grippers"
readme = "README.md"
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["specialist_description"]
exclude = ["**/cad"]

[dependency-groups]
dev = [
  "mujoco>=3.17",
  "numpy>=2.0",
  "onshape-to-robot>=1.8.0",
  "pytest>=8.0",
  "ruff>=0.14",
  "trimesh>=4.0",
  "xacro>=2.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
